name: Collect TPEx
on:
  schedule:
    # Taipei weekdays 14:17–18:47; ten runs cover a dropped scheduled run.
    - cron: '17,47 6-10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tpex-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: 3c676fc88af6a57ca934efd0627c9cde
      KV_NAMESPACE_ID: e92149e1efec4434835310d434b69f7d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/dist/publish-tpex.mjs --out "$RUNNER_TEMP/tpex"
        env:
          CLOUDFLARE_KV_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_KV_WRITE_TOKEN }}
