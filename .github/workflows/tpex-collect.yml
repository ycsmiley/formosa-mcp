name: Collect TPEx
on:
  schedule:
    # Taipei weekdays 14:17–18:47; ten runs cover a dropped scheduled run.
    - cron: '17,47 6-10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tpex-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      KV_NAMESPACE_ID: e92149e1efec4434835310d434b69f7d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The committed bundle skips npm ci, so there is no npm cache to save.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID repo variable is empty"; exit 1; }
      - run: node scripts/dist/publish-tpex.mjs --out "$RUNNER_TEMP/tpex"
        env:
          CLOUDFLARE_KV_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_KV_WRITE_TOKEN }}
