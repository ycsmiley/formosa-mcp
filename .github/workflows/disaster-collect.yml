name: Collect disaster snapshots
on:
  schedule:
    - cron: '20 * * * *' # Away from Worker x5 NCDR requests; delayed starts use a quiet window
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: disaster-collect
  cancel-in-progress: false
jobs:
  collect:
    # Cheap case-insensitive pre-filter; the first step enforces exactly lowercase 'true'.
    if: vars.DISASTER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      KV_NAMESPACE_ID: e92149e1efec4434835310d434b69f7d
    steps:
      - id: gate
        env:
          DISASTER_ENABLED: ${{ vars.DISASTER_ENABLED }}
        shell: bash
        run: |
          if [ "$DISASTER_ENABLED" = true ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Disaster collection disabled: DISASTER_ENABLED must be exactly lowercase true."
          fi
          exit 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
      - run: test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID repo variable is empty"; exit 1; }
        if: steps.gate.outputs.enabled == 'true'
      - run: node scripts/dist/publish-disaster.mjs
        if: steps.gate.outputs.enabled == 'true'
        env:
          CLOUDFLARE_KV_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_KV_WRITE_TOKEN }}
