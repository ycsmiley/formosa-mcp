name: Collect garbage snapshots
on:
  schedule:
    - cron: '37 3 * * *' # 11:37 Taipei
    - cron: '0 21 * * *' # 05:00 Taipei
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: garbage-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      KV_NAMESPACE_ID: e92149e1efec4434835310d434b69f7d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID repo variable is empty"; exit 1; }
      - run: |
          if [ "$COLLECT_SCHEDULE" = '0 21 * * *' ]; then
            node scripts/dist/publish-garbage.mjs --city kaohsiung
          else
            node scripts/dist/publish-garbage.mjs
          fi
        env:
          COLLECT_SCHEDULE: ${{ github.event.schedule }}
          CLOUDFLARE_KV_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_KV_WRITE_TOKEN }}
