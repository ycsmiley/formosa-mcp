# Run only after deploy; consumes TDX quota only via cache misses, bounded by the caps.
name: Remote rail abuse test
on:
  workflow_dispatch:
    inputs:
      url:
        description: Deployed MCP endpoint (include /mcp)
        required: true
        type: string
      requests:
        description: Requests per rotating runner (hammer sends three times this)
        default: 120
        type: number
      concurrency:
        description: Parallel requests per runner
        default: 8
        type: number
      runners:
        description: Separate rotating runners / egress IPs
        default: '3'
        type: choice
        options: ['1', '3', '5']
permissions:
  contents: read
concurrency:
  group: remote-rail-abuse-test
  cancel-in-progress: false
jobs:
  before:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      monitor: ${{ steps.usage.outputs.monitor }}
      usage: ${{ steps.usage.outputs.usage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - id: matrix
        env:
          RUNNERS: ${{ inputs.runners }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const n = Number(process.env.RUNNERS);
          if (![1, 3, 5].includes(n)) throw new Error('Invalid runner count');
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({runner: Array.from({length: n}, (_, i) => i + 1)})}\n`);
          NODE
      - id: usage
        name: Optional usage before load
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SNAPSHOTS_KV_ID: ${{ vars.SNAPSHOTS_KV_ID || secrets.SNAPSHOTS_KV_ID }}
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.SNAPSHOTS_KV_ID != '' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const { CLOUDFLARE_API_TOKEN: token, CLOUDFLARE_ACCOUNT_ID: account, SNAPSHOTS_KV_ID: kv } = process.env;
          const url = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}/storage/kv/namespaces/${encodeURIComponent(kv)}/values/tdx%3Ausage%3Av1`;
          const response = await fetch(url, { headers: { authorization: `Bearer ${token}` }, redirect: 'error', signal: AbortSignal.timeout(30000) });
          if (!response.ok) throw new Error(`KV usage read HTTP ${response.status}`);
          const data = await response.json();
          const usage = { month: data.month, today: data.today };
          for (const key of ['monthUsed', 'todayUsed', 'dailyBudget', 'last60s']) {
            if (!Number.isFinite(data[key]) || data[key] < 0) throw new Error('Invalid usage record');
            usage[key] = data[key];
          }
          console.log('Usage before:', JSON.stringify(usage));
          appendFileSync(process.env.GITHUB_OUTPUT, `monitor=true\nusage=${JSON.stringify(usage)}\n`);
          NODE
  hammer:
    name: hammer (single IP)
    needs: before
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Hammer from this runner's single egress IP
        env:
          URL: ${{ inputs.url }}
          REQUESTS: ${{ inputs.requests }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          HAMMER_REQUESTS=$(node --input-type=module -e 'const n = Number(process.env.REQUESTS); if (!Number.isSafeInteger(n) || n < 1 || !Number.isSafeInteger(n * 3)) process.exit(1); console.log(n * 3)')
          node scripts/abuse-test.mjs --url "$URL" --requests "$HAMMER_REQUESTS" --concurrency "$CONCURRENCY" --label hammer
  rotate:
    name: rotate (${{ matrix.runner }})
    needs: [before, hammer]
    if: ${{ !cancelled() && needs.before.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.before.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Separate runners supply different egress IPs; no synthetic header in production.
      - env:
          URL: ${{ inputs.url }}
          REQUESTS: ${{ inputs.requests }}
          CONCURRENCY: ${{ inputs.concurrency }}
          LABEL: rotate-${{ matrix.runner }}
        run: node scripts/abuse-test.mjs --url "$URL" --requests "$REQUESTS" --concurrency "$CONCURRENCY" --label "$LABEL"
  after:
    name: Optional usage delta
    needs: [before, hammer, rotate]
    if: ${{ always() && !cancelled() && needs.before.outputs.monitor == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SNAPSHOTS_KV_ID: ${{ vars.SNAPSHOTS_KV_ID || secrets.SNAPSHOTS_KV_ID }}
          BEFORE_USAGE: ${{ needs.before.outputs.usage }}
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.SNAPSHOTS_KV_ID != '' }}
        run: |
          node --input-type=module <<'NODE'
          const { CLOUDFLARE_API_TOKEN: token, CLOUDFLARE_ACCOUNT_ID: account, SNAPSHOTS_KV_ID: kv } = process.env;
          const url = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}/storage/kv/namespaces/${encodeURIComponent(kv)}/values/tdx%3Ausage%3Av1`;
          const response = await fetch(url, { headers: { authorization: `Bearer ${token}` }, redirect: 'error', signal: AbortSignal.timeout(30000) });
          if (!response.ok) throw new Error(`KV usage read HTTP ${response.status}`);
          const data = await response.json(), before = JSON.parse(process.env.BEFORE_USAGE);
          const after = { month: data.month, today: data.today, updatedAt: data.updatedAt };
          for (const key of ['monthUsed', 'todayUsed', 'dailyBudget', 'last60s']) {
            if (!Number.isFinite(data[key]) || data[key] < 0) throw new Error('Invalid usage record');
            after[key] = data[key];
          }
          console.log('Usage after:', JSON.stringify(after));
          console.log('Delta:', JSON.stringify({
            monthUsed: before.month === after.month ? after.monthUsed - before.monthUsed : null,
            todayUsed: before.today === after.today ? after.todayUsed - before.todayUsed : null,
            last60s: after.last60s - before.last60s,
          }));
          // KV can lag 15 minutes; these are observations, not an exact request ledger.
          if (after.todayUsed > after.dailyBudget || after.last60s > 4) process.exitCode = 1;
          NODE
