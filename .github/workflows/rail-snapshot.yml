name: Collect rail snapshots
on:
  schedule:
    # Taipei 00:23/04:23
    - cron: '23 16,20 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rail-snapshot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      KV_NAMESPACE_ID: e92149e1efec4434835310d434b69f7d
    steps:
      - id: guard
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: |
          if [ -n "$TDX_CLIENT_ID" ] && [ -n "$TDX_CLIENT_SECRET" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::rail snapshot skipped: TDX_CLIENT_ID/TDX_CLIENT_SECRET not set"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        if: steps.guard.outputs.enabled == 'true'
      # The committed bundle skips npm ci.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
        if: steps.guard.outputs.enabled == 'true'
      - if: steps.guard.outputs.enabled == 'true'
        run: test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID repo variable is empty"; exit 1; }
      - if: steps.guard.outputs.enabled == 'true'
        run: node scripts/dist/publish-rail.mjs
        env:
          TDX_SNAPSHOT_RESERVE: ${{ vars.TDX_SNAPSHOT_RESERVE }}
          TDX_MONTHLY_QUOTA: ${{ vars.TDX_MONTHLY_QUOTA }}
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
          CLOUDFLARE_KV_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_KV_WRITE_TOKEN }}
